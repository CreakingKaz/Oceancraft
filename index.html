<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oceancraft</title>
    <link rel="stylesheet" href="css/styles.css?v=raft-core-2">
</head>
<body class="theme-dark">
    <canvas id="gameCanvas" aria-label="Océano y balsa"></canvas>

    <main id="main-menu" class="screen">
        <h1>Oceancraft</h1>
        <p class="menu-subtitle">Sobrevive, recoge y crea en alta mar.</p>
        <section class="menu-box">
            <label for="player-icon">Identificador del jugador</label>
            <input type="text" id="player-icon" class="input-field" placeholder="Kaz o ☁️" maxlength="3">
            <label for="player-color">Color del jugador</label>
            <input type="color" id="player-color" class="color-picker" value="#e74c3c">
            <button class="btn btn-primary" onclick="startGame(true)">Nueva aventura</button>
            <button class="btn" id="continue-btn" onclick="continueGame()">Continuar partida</button>
            <p id="menu-message" class="menu-message" aria-live="polite"></p>
        </section>
    </main>

    <section id="game-ui" class="hidden" aria-label="Interfaz de juego">
        <header id="top-hud">
            <button class="icon-btn" onclick="toggleMenu('settings-modal')" aria-label="Abrir ajustes">☰</button>
            <div id="stats-panel" class="hud-panel">
                <div id="ui-clock" class="clock">Día 1 · 08:00</div>
                <div class="stat-line"><span class="stat-name stat-food">♥ Comida</span><span id="stat-hunger">100%</span><div class="stat-track"><div id="bar-hunger" class="stat-fill food-fill"></div></div></div>
                <div class="stat-line"><span class="stat-name stat-water">▤ Agua</span><span id="stat-thirst">100%</span><div class="stat-track"><div id="bar-thirst" class="stat-fill water-fill"></div></div></div>
                <div class="stat-line"><span class="stat-name stat-energy">☀ Energía</span><span id="stat-energy">100%</span><div class="stat-track"><div id="bar-energy" class="stat-fill energy-fill"></div></div></div>
            </div>
            <aside id="history-log" class="hud-panel" aria-label="Historial de acciones"></aside>
        </header>

        <div id="notifications" aria-live="polite"></div>

        <footer id="bottom-hud">
            <div id="hotbar" aria-label="Accesos rápidos">
                <button class="hotbar-slot selected" id="slot-0" onclick="selectSlot(0)" aria-label="Espacio rápido 1"></button>
                <button class="hotbar-slot" id="slot-1" onclick="selectSlot(1)" aria-label="Espacio rápido 2"></button>
                <button class="hotbar-slot" id="slot-2" onclick="selectSlot(2)" aria-label="Espacio rápido 3"></button>
            </div>
            <div id="main-actions">
                <button class="btn side-action" onclick="sleepAction()">Dormir</button>
                <button class="btn side-action" onclick="toggleMenu('inventory-modal')">Inventario</button>
                <button class="btn side-action" onclick="toggleMenu('craft-modal')">Crafteo</button>
                <button class="btn action-btn" id="action-btn" onclick="doPrimaryAction()">Buscar objetos</button>
            </div>
        </footer>
    </section>

    <section id="inventory-modal" class="modal hidden" role="dialog" aria-label="Inventario">
        <header class="modal-header">
            <h2>Inventario <span id="inv-count">0</span>/30</h2>
            <button class="icon-btn" onclick="toggleMenu('inventory-modal')" aria-label="Cerrar inventario">×</button>
        </header>
        <nav class="tabs" id="inv-tabs">
            <button class="tab active" data-category="todo" onclick="setInvTab('todo')">Todo</button>
            <button class="tab" data-category="mat" onclick="setInvTab('mat')">Recursos</button>
            <button class="tab" data-category="herr" onclick="setInvTab('herr')">Herramientas</button>
            <button class="tab" data-category="com" onclick="setInvTab('com')">Comida</button>
        </nav>
        <label class="filter-row">Ordenar <select id="inv-filter" onchange="renderInventory()"><option value="new">Más recientes</option><option value="qty">Cantidad</option></select></label>
        <div id="inv-grid" class="item-list"></div>
        <footer class="lore-box">
            <p id="lore-text">Selecciona un objeto para ver su información.</p>
            <div id="lore-actions" class="lore-actions"></div>
        </footer>
    </section>

    <section id="craft-modal" class="modal hidden" role="dialog" aria-label="Crafteo">
        <header class="modal-header">
            <h2>Crafteo</h2>
            <button class="icon-btn" onclick="toggleMenu('craft-modal')" aria-label="Cerrar crafteo">×</button>
        </header>
        <nav class="tabs" id="craft-tabs">
            <button class="tab active" data-category="todo" onclick="setCraftTab('todo')">Todo</button>
            <button class="tab" data-category="mat" onclick="setCraftTab('mat')">Recursos</button>
            <button class="tab" data-category="herr" onclick="setCraftTab('herr')">Herramientas</button>
            <button class="tab" data-category="com" onclick="setCraftTab('com')">Comida</button>
        </nav>
        <label class="filter-row"><input type="checkbox" id="show-all-craft" checked onchange="renderCraftMenu()"> Mostrar recetas bloqueadas</label>
        <div id="craft-list" class="item-list"></div>
        <footer class="lore-box">
            <p id="craft-lore-text">Selecciona una receta para ver los materiales necesarios.</p>
            <div id="craft-actions" class="lore-actions"></div>
        </footer>
    </section>

    <section id="settings-modal" class="modal small-modal hidden" role="dialog" aria-label="Ajustes">
        <header class="modal-header">
            <h2>Menú</h2>
            <button class="icon-btn" onclick="toggleMenu('settings-modal')" aria-label="Cerrar menú">×</button>
        </header>
        <nav class="tabs">
            <button class="tab active">Juego</button>
            <button class="tab">Interfaz</button>
        </nav>
        <div class="settings-content">
            <p>Estadísticas</p>
            <div class="setting-buttons"><button class="btn" onclick="setStatFormat('bar')">Barras</button><button class="btn" onclick="setStatFormat('percent')">Porcentajes</button></div>
            <p>Estilo visual</p>
            <div class="setting-buttons"><button class="btn" onclick="setVisualMode('auto')">Automático</button><button class="btn" onclick="setVisualMode('day')">Día eterno</button><button class="btn" onclick="setVisualMode('night')">Noche eterna</button></div>
            <p>Temas de los menús</p>
            <div class="setting-buttons"><button class="btn" onclick="setTheme('dark')">Oscuro</button><button class="btn" onclick="setTheme('light')">Claro</button><button class="btn" onclick="setTheme('ocean')">Océano</button></div>
            <label class="opacity-setting">Opacidad de la interfaz <input type="range" id="opacity-slider" min="0.45" max="1" step="0.05" value="0.9" onchange="updateUIOpacity()"></label>
            <button class="btn btn-primary" onclick="saveGame(false)">Guardar partida</button>
        </div>
    </section>

    <script src="js/items.js?v=raft-core-2"></script>
    <script src="js/ui.js?v=raft-core-2"></script>
    <script src="js/engine-v3.js"></script>
</body>
</html>
