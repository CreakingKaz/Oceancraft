<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oceancraft</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-dark">

    <!-- MENÚ DE INICIO -->
    <div id="main-menu" class="ui-layer">
        <h1>Oceancraft</h1>
        <div class="menu-box">
            <h3>Nueva Partida</h3>
            <input type="text" id="player-icon" class="input-field" placeholder="Tu icono (Ej: Kaz o ☁️)" maxlength="3">
            <input type="color" id="player-color" class="color-picker" value="#e74c3c">
            <button class="btn" onclick="startGame()">Comenzar Aventura</button>
        </div>
    </div>

    <!-- INTERFAZ DEL JUEGO (HUD) -->
    <div id="game-ui" class="ui-layer hidden">
        
        <!-- Botones Superiores (Zoom y Ajustes) -->
        <div id="top-hud">
            <button class="btn" onclick="zoomIn()">Zoom +</button>
            <button class="btn" onclick="zoomOut()">Zoom -</button>
            <button class="btn" onclick="toggleMenu('inventory-modal')">🎒 Inventario</button>
            <div class="slider-container">
                <label>Opacidad UI:</label>
                <input type="range" id="opacity-slider" min="0.3" max="1" step="0.1" value="0.9" onchange="updateUIOpacity()">
            </div>
        </div>

        <!-- Hotbar Inferior -->
        <div id="bottom-hud" style="position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 10px; pointer-events: auto;">
            <div class="hotbar-slot selected" id="slot-0" onclick="selectSlot(0)"></div>
            <div class="hotbar-slot" id="slot-1" onclick="selectSlot(1)"></div>
            <div class="hotbar-slot" id="slot-2" onclick="selectSlot(2)"></div>
            <button class="btn" id="action-btn" onclick="doAction()" style="padding: 15px 30px; font-size: 18px; margin-left: 20px;">Buscar</button>
        </div>
    </div>

    <!-- MODAL DE INVENTARIO -->
    <div id="inventory-modal" class="modal hidden" style="position: absolute; top: 10%; left: 10%; width: 80%; height: 75%; background: var(--menu-bg); border: 4px solid var(--menu-border); border-radius: 10px; z-index: 100; pointer-events: auto; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; padding: 10px; background: rgba(0,0,0,0.5); color: white;">
            <h2>Inventario (<span id="inv-count">0</span>/30)</h2>
            <button class="btn" style="background: #e74c3c;" onclick="toggleMenu('inventory-modal')">X</button>
        </div>
        <!-- Pestañas -->
        <div style="display: flex; background: #222; border-bottom: 2px solid #555; color: white;">
            <div class="tab active" onclick="setInvTab('todo')" style="padding: 10px; cursor: pointer;">Todo</div>
            <div class="tab" onclick="setInvTab('mat')" style="padding: 10px; cursor: pointer;">Materiales</div>
            <div class="tab" onclick="setInvTab('herr')" style="padding: 10px; cursor: pointer;">Herramientas</div>
        </div>
        <!-- Grid de Items -->
        <div id="inv-grid" style="flex: 1; padding: 10px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px;">
            <!-- Se llena con JS -->
        </div>
        <!-- Lore Box (Información del ítem) -->
        <div id="lore-box" style="padding: 15px; background: #111; color: white; border-top: 2px solid var(--menu-border); min-height: 80px;">
            <p id="lore-text">Selecciona un ítem para ver sus detalles.</p>
            <div id="lore-actions" style="margin-top: 10px; display: flex; gap: 5px;"></div>
        </div>
    </div>

    <!-- CANVAS MOTOR GRÁFICO -->
    <canvas id="gameCanvas"></canvas>

    <!-- SCRIPTS EN ORDEN CORRECTO -->
    <script src="js/items.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
