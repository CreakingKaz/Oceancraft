<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oceancraft</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- FONDO DE JUEGO (Se renderiza inmediatamente) -->
    <canvas id="gameCanvas"></canvas>

    <!-- PANTALLA DE CARGA ESTILO TERRARIA (Desaparece sola) -->
    <div id="splash-screen">
        <h1 class="splash-logo">Star Studios</h1>
    </div>

    <!-- CAPA DE MENÚ -->
    <div id="menu-layer" class="ui-layer hidden">
        
        <!-- Menú Principal -->
        <div id="main-menu" class="menu-panel">
            <h1 class="ocean-title">OCEANCRAFT</h1>
            <button class="btn btn-menu" onclick="showMenuPanel('new-game-panel')">Nuevo Juego</button>
            <button class="btn btn-menu" onclick="showMenuPanel('continue-panel')">Continuar</button>
            <button class="btn btn-menu" onclick="showMenuPanel('cosmetics-panel')">Cosméticos</button>
        </div>

        <!-- Nuevo Juego -->
        <div id="new-game-panel" class="menu-panel hidden">
            <h2>Crear Mundo</h2>
            <input type="text" id="world-name" class="input-field" placeholder="Nombre del Mundo (Ej: Archipiélago)">
            
            <label>Dificultad:</label>
            <select id="world-diff" class="input-field">
                <option value="0.5">Fácil</option>
                <option value="1" selected>Normal</option>
                <option value="2">Difícil</option>
            </select>
            
            <label>Frecuencia de Islas/Barcos:</label>
            <select id="world-freq" class="input-field">
                <option value="low">Baja</option>
                <option value="normal" selected>Normal</option>
                <option value="high">Alta</option>
            </select>
            
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-close" onclick="showMenuPanel('main-menu')">Volver</button>
                <button class="btn" onclick="createNewGame()">Empezar</button>
            </div>
        </div>

        <!-- Continuar -->
        <div id="continue-panel" class="menu-panel hidden">
            <h2>Seleccionar Partida</h2>
            <div id="slots-container">
                <div class="slot-card" onclick="loadGame(1)"><div class="slot-icon">1</div><div class="slot-info" id="slot-1-info"></div></div>
                <div class="slot-card" onclick="loadGame(2)"><div class="slot-icon">2</div><div class="slot-info" id="slot-2-info"></div></div>
                <div class="slot-card" onclick="loadGame(3)"><div class="slot-icon">3</div><div class="slot-info" id="slot-3-info"></div></div>
            </div>
            <button class="btn btn-close" style="margin-top:20px; width:100%;" onclick="showMenuPanel('main-menu')">Volver</button>
        </div>

        <!-- Cosméticos (Rediseño visual en tiempo real) -->
        <div id="cosmetics-panel" class="menu-panel hidden" style="max-width: 500px;">
            <h2>Cosméticos</h2>
            <div class="cosmetics-layout">
                <!-- Izquierda: Controles -->
                <div class="cosmetics-left">
                    <label>Color del Personaje:</label>
                    <input type="color" id="player-color" class="color-picker" value="#f39c12" oninput="updatePreview()">
                    <label>Letra Inicial:</label>
                    <input type="text" id="player-icon" class="input-field" value="K" maxlength="1" oninput="updatePreview()" style="text-align: center; font-size: 20px;">
                    <label>Opacidad UI:</label>
                    <input type="range" id="opacity-slider" min="0.3" max="1" step="0.1" value="0.85" onchange="updateOpacity()" style="width:100%;">
                </div>
                <!-- Derecha: Previsualización -->
                <div class="cosmetics-right">
                    <div id="player-preview">K</div>
                </div>
            </div>
            <button class="btn btn-close" style="margin-top:20px; width:100%;" onclick="showMenuPanel('main-menu')">Volver</button>
        </div>
    </div>

    <!-- INTERFAZ DEL JUEGO -->
    <div id="game-ui" class="hidden ui-layer">
        <!-- (El HUD se mantiene igual, se inyecta por UI.js) -->
        <div class="hud-box">
            <strong id="ui-clock" style="font-size:18px; color:#f1c40f;">Día 1 - 08:00</strong><br>
            ❤ Vida: <span id="ui-hp" style="color:#e74c3c; font-weight:bold;">100</span><br>
            🍖 Hambre: <span id="ui-food" style="color:#e67e22;">100</span><br>
            💧 Sed: <span id="ui-thirst" style="color:#3498db;">100</span><br>
            💤 Sueño: <span id="ui-sleep" style="color:#9b59b6;">100</span>
        </div>
        <div id="side-menus">
            <button class="btn-icon" onclick="toggleMenu('inventory-modal')">🎒</button>
            <button class="btn-icon" onclick="toggleMenu('craft-modal')">🔨</button>
            <button class="btn-icon" onclick="saveGame()">💾</button>
        </div>
        <div id="bottom-controls">
            <div style="display: flex; gap: 10px;">
                <div class="hotbar-slot selected" id="slot-0" onclick="selectSlot(0)"></div>
                <div class="hotbar-slot" id="slot-1" onclick="selectSlot(1)"></div>
                <div class="hotbar-slot" id="slot-2" onclick="selectSlot(2)"></div>
            </div>
            <button id="action-btn" class="btn" style="width: 220px; font-size: 18px;" onclick="doAction()">Buscar a mano</button>
            <div id="zoom-container">
                <span>🔍</span>
                <input type="range" id="zoom-slider" min="0.5" max="3" step="0.1" value="1.5" onchange="updateZoom()">
            </div>
        </div>
        <div id="notifications"></div>
    </div>

    <!-- Scripts -->
    <script src="js/items.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
