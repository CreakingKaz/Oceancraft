<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oceancraft - UI Moderno</title>
    <!-- Fuente moderna y limpia para coincidir con la imagen -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="loading-screen">Generando mundo...</div>

    <div id="game-container" style="display: none;">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            
            <!-- PANEL SUPERIOR IZQUIERDO (Tiempo, Estadísticas y Log) -->
            <div class="panel-left">
                <div id="time-display">Día 1 - 08:00</div>
                <div class="divider"></div>
                
                <div class="stats-container">
                    <div class="stat-row"><span class="stat-lbl c-red">VIDA</span><div class="bar-bg"><div id="bar-health" class="bar-fill bg-red"></div></div></div>
                    <div class="stat-row"><span class="stat-lbl c-yellow">ENRG</span><div class="bar-bg"><div id="bar-energy" class="bar-fill bg-yellow"></div></div></div>
                    <div class="stat-row"><span class="stat-lbl c-blue">AGUA</span><div class="bar-bg"><div id="bar-thirst" class="bar-fill bg-blue"></div></div></div>
                    <div class="stat-row"><span class="stat-lbl c-orange">CMDA</span><div class="bar-bg"><div id="bar-hunger" class="bar-fill bg-orange"></div></div></div>
                    <div class="stat-row"><span class="stat-lbl c-green">TOXI</span><div class="bar-bg"><div id="bar-toxicity" class="bar-fill bg-green"></div></div></div>
                </div>

                <div class="divider"></div>
                
                <!-- Log de eventos -->
                <div id="event-log"></div>
            </div>

            <!-- BOTÓN OPCIONES (Arriba Derecha) -->
            <button id="btn-opc" class="btn-top-right">OPC</button>

            <!-- INTERFAZ INFERIOR CENTRAL -->
            <div class="panel-bottom">
                
                <!-- Controles de Cámara -->
                <div class="camera-controls">
                    <button id="cam-minus">-</button>
                    <span>Cámara</span>
                    <button id="cam-plus">+</button>
                </div>

                <!-- Botones y Hotbar -->
                <div class="bottom-actions">
                    <div class="side-buttons">
                        <button class="btn-side bg-purple">Horno</button>
                        <button class="btn-side bg-darkblue">Básico</button>
                    </div>

                    <div class="hotbar">
                        <div class="slot" data-slot="1"></div>
                        <div class="slot active-slot" data-slot="2">
                            <img src="" style="display:none;">
                            <span class="slot-qty">x1</span>
                        </div>
                        <div class="slot" data-slot="3"></div>
                    </div>

                    <div class="main-buttons">
                        <button id="btn-eat" class="btn-main bg-brightblue">Comer</button>
                        <button id="btn-inv" class="btn-main bg-darkblue">INV</button>
                    </div>
                </div>
            </div>

            <!-- MENÚS PREPARADOS (Ocultos por defecto) -->
            <div id="menu-overlay" class="hidden">
                <div id="inventory-menu" class="menu-window hidden">
                    <h2>Inventario</h2>
                    <div class="inv-grid"></div>
                    <button class="btn-close">Cerrar</button>
                </div>
                <div id="options-menu" class="menu-window hidden">
                    <h2>Opciones</h2>
                    <button id="btn-save" class="btn-main bg-brightblue">Guardar Partida</button>
                    <button class="btn-close">Cerrar</button>
                </div>
            </div>

        </div>
    </div>

    <script src="js/core/assets.js"></script>
    <script src="js/items.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/ui/menus.js"></script>
    <script src="js/mechanics/inventory.js"></script>
    <script src="js/mechanics/hook.js"></script>
    <script src="js/mechanics/debris.js"></script>
    <script src="js/mechanics/player.js"></script>
    <script src="js/world/world.js"></script>
    <script src="js/core/engine.js"></script>
</body>
</html>
