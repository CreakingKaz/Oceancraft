<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oceancraft - Creado 100% con IA</title>
    <!-- Fuente Pixel-Art de Google Fonts para mejorar la estética -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Pantalla de carga -->
    <div id="loading-screen">Generando mundo...</div>

    <!-- Contenedor principal del Juego -->
    <div id="game-container" style="display: none;">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Interfaz de Usuario -->
        <div id="ui-layer">
            <!-- Petición 1: Botones de guardado y opciones arriba a la derecha -->
            <div class="ui-top-right">
                <button id="btn-save">Guardado Rápido</button>
                <button id="btn-options">Opciones</button>
            </div>

            <!-- Estadísticas de supervivencia arriba a la izquierda -->
            <div class="ui-stats">
                <div class="stat-bar"><span class="label">VIDA:</span> <span id="health-val">100</span>%</div>
                <div class="stat-bar"><span class="label">AGUA:</span> <span id="thirst-val">100</span>%</div>
                <div class="stat-bar"><span class="label">COMIDA:</span> <span id="hunger-val">100</span>%</div>
            </div>
            
            <div id="click-prompt">Haz clic en cualquier lado para activar el sonido ambiental</div>
        </div>
    </div>

    <!-- Scripts (El orden de carga es importante) -->
    <script src="js/core/assets.js"></script>
    <script src="js/items.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/world/world.js"></script>
    <script src="js/core/engine.js"></script>
</body>
</html>
